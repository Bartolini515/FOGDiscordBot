name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIPENV_DONT_LOAD_ENV: "1"
  PIPENV_NOSPIN: "1"
  PIPENV_VENV_IN_PROJECT: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install --disable-pip-version-check "pipenv==2026.8.0"

      - name: Show tool versions
        run: |
          python --version
          pipenv --version

      - name: Verify lockfile
        run: pipenv verify

      - name: Sync locked dependencies
        run: pipenv sync --dev

      - name: Check diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff-tree --root --check -r "$AFTER_SHA"
              else
                git diff --check "$BEFORE_SHA" "$AFTER_SHA"
              fi
              ;;
            *)
              echo "Unsupported event for whitespace validation: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Run Definition of Done
        run: pipenv run check

      - name: Ensure checks did not modify tracked files
        if: ${{ always() }}
        run: |
          set -euo pipefail

          status="$(git status --short --untracked-files=no)"
          if [[ -n "$status" ]]; then
            echo "Tracked files were modified by CI checks:"
            printf '%s\n' "$status"
          fi

          failed=0
          if ! git diff --exit-code --; then
            failed=1
          fi
          if ! git diff --cached --exit-code --; then
            failed=1
          fi

          if (( failed )); then
            exit 1
          fi
